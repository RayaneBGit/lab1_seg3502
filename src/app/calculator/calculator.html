<table>
  <tr>
    <td>
      <label for="firstNumber">Premier nombre:</label>
    </td>
    <td>
      <input type="number" id="firstNumber" #firstNumber>
    </td>
  </tr>

  <tr>
    <td>
      <label for="secondNumber">Second nombre:</label>
    </td>
    <td>
      <input type="number" id="secondNumber" #secondNumber>
    </td>
  </tr>

  <tr>
    <td>
      <label>Resultat:</label>
    </td>
    <td>
      <input type="number" [value]="result" readonly>
    </td>
  </tr>
</table>

<div>
  <button (click)="calculate(firstNumber.value, secondNumber.value, '+')">+</button>

  <button (click)="calculate(firstNumber.value, secondNumber.value, '-')">-</button>

  <button (click)="calculate(firstNumber.value, secondNumber.value, '*')">*</button>

  <button (click)="calculate(firstNumber.value, secondNumber.value, '/')">/</button>
</div>
